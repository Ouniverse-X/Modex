<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      .title { font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .head { font:700 21px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#263238; }
      .txt { font:18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#263238; }
      .small { font:16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#455a64; }
      .math { font:italic 21px "Times New Roman",serif; fill:#263238; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfcfe"/>
  <text x="640" y="48" text-anchor="middle" class="title">径向控制体、界面通量与 Robin 表面边界</text>

  <g transform="translate(55,100)">
    <text x="220" y="20" text-anchor="middle" class="head">横截面中的环形控制体</text>
    <circle cx="220" cy="245" r="185" fill="#f7e6bf" stroke="#6d4c2e" stroke-width="3"/>
    <circle cx="220" cy="245" r="128" fill="#d9edf7" stroke="#1565c0" stroke-width="3"/>
    <circle cx="220" cy="245" r="82" fill="#f7e6bf" stroke="#1565c0" stroke-width="3"/>
    <circle cx="220" cy="245" r="5" fill="#263238"/>
    <line x1="220" y1="245" x2="302" y2="245" stroke="#455a64" stroke-width="2"/>
    <line x1="220" y1="245" x2="348" y2="245" stroke="#455a64" stroke-width="2"/>
    <text x="255" y="235" class="math">r_w</text>
    <text x="308" y="235" class="math">r_e</text>
    <text x="220" y="468" text-anchor="middle" class="txt">蓝色环带即节点 i 的控制体</text>
    <text x="220" y="500" text-anchor="middle" class="math">M_i = (r_e² − r_w²)/2</text>
  </g>

  <g transform="translate(520,105)">
    <text x="330" y="20" text-anchor="middle" class="head">沿半径展开后的离散结构</text>
    <line x1="30" y1="225" x2="665" y2="225" stroke="#37474f" stroke-width="4"/>
    <rect x="225" y="145" width="220" height="160" fill="#d9edf7" opacity="0.82" stroke="#1565c0" stroke-width="2"/>
    <line x1="225" y1="130" x2="225" y2="320" stroke="#1565c0" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="445" y1="130" x2="445" y2="320" stroke="#1565c0" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="140" cy="225" r="8" fill="#263238"/>
    <circle cx="335" cy="225" r="10" fill="#1565c0"/>
    <circle cx="535" cy="225" r="8" fill="#263238"/>
    <line x1="655" y1="92" x2="655" y2="358" stroke="#6d4c2e" stroke-width="6"/>
    <text x="132" y="265" class="math">i−1</text>
    <text x="328" y="265" class="math">i</text>
    <text x="528" y="265" class="math">i+1</text>
    <text x="206" y="118" class="math">r_w</text>
    <text x="427" y="118" class="math">r_e</text>
    <text x="642" y="383" class="math">r=R</text>

    <line x1="270" y1="185" x2="220" y2="185" stroke="#1565c0" stroke-width="4" marker-end="url(#a1)"/>
    <line x1="400" y1="185" x2="450" y2="185" stroke="#1565c0" stroke-width="4" marker-end="url(#a1)"/>
    <text x="335" y="168" text-anchor="middle" class="small">西、东界面扩散通量</text>

    <line x1="750" y1="176" x2="670" y2="176" stroke="#c62828" stroke-width="4" marker-end="url(#a2)"/>
    <text x="710" y="148" text-anchor="middle" class="small">h(T∞−Tₛ)</text>
    <line x1="670" y1="280" x2="750" y2="280" stroke="#1565c0" stroke-width="4" marker-end="url(#a1)"/>
    <text x="710" y="315" text-anchor="middle" class="small">hₘ(Cₛ−C∞)</text>

    <rect x="50" y="410" width="770" height="150" rx="14" fill="#f4f7fa" stroke="#90a4ae"/>
    <text x="435" y="447" text-anchor="middle" class="math">S_i dφ_i/dt = G_e(φ_{i+1}−φ_i) − G_w(φ_i−φ_{i−1})</text>
    <text x="435" y="485" text-anchor="middle" class="math">G_e = r_e Γ_e /(r_{i+1}−r_i)</text>
    <text x="435" y="523" text-anchor="middle" class="txt">同一界面只计算一次通量，并以相反符号进入相邻控制体，因此离散守恒。</text>
  </g>

  <rect x="80" y="648" width="1120" height="44" rx="10" fill="#fff4e5" stroke="#e0a24a"/>
  <text x="640" y="678" text-anchor="middle" class="txt">中心面面积为零，自然给出对称条件；表面控制体直接加入对流换热或传质通量。</text>
</svg>
